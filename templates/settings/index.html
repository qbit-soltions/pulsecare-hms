{% extends "base.html" %}

{% block title %}Hospital Settings{% endblock %}
{% block header_title %}PulseCare System Configuration & Hospital Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card-custom">
      <div class="card-header-custom">
        <h6 class="fw-bold m-0"><i class="bi bi-gear-fill text-primary me-2"></i>Hospital General Profile & Billing Settings</h6>
      </div>
      <div class="card-body-custom fs-7">
        <form method="POST">
          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold">Hospital Name <span class="text-danger">*</span></label>
              <input type="text" name="hospital_name" class="form-control form-control-sm" required value="{{ settings.hospital_name }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Hospital Code / Reg #</label>
              <input type="text" name="registration_number" class="form-control form-control-sm" value="{{ settings.registration_number }}">
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Tagline / Motto</label>
              <input type="text" name="tagline" class="form-control form-control-sm" value="{{ settings.tagline }}">
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Hospital Facility Address</label>
              <input type="text" name="address" class="form-control form-control-sm" value="{{ settings.address }}">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Main Phone Number</label>
              <input type="tel" name="phone" class="form-control form-control-sm" value="{{ settings.phone }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Emergency 24x7 Hotline</label>
              <input type="tel" name="emergency_hotline" class="form-control form-control-sm" value="{{ settings.emergency_hotline }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Official Email</label>
              <input type="email" name="email" class="form-control form-control-sm" value="{{ settings.email }}">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Default Currency Symbol</label>
              <input type="text" name="currency" class="form-control form-control-sm" value="{{ settings.currency }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Default Billing Tax Rate (%)</label>
              <input type="number" step="0.1" name="tax_rate" class="form-control form-control-sm" value="{{ settings.tax_rate }}">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 border-top pt-3">
            <button type="submit" class="btn btn-sm btn-primary px-4 fw-semibold">
              <i class="bi bi-save me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
