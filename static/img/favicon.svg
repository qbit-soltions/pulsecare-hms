<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Medical Cross Base (White, softly transparent) -->
  <g filter="url(#glow)">
    <!-- Vertical bar -->
    <rect x="27" y="12" width="10" height="40" rx="3" fill="#ffffff" fill-opacity="0.95" />
    <!-- Horizontal bar -->
    <rect x="12" y="27" width="40" height="10" rx="3" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Dynamic Pulse / Heartbeat Line (Cyan to Emerald Green) -->
  <path d="M 12 32 L 23 32 L 27 21 L 32 43 L 37 25 L 41 35 L 44 32 L 52 32"
        fill="none"
        stroke="#0284c7"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <path d="M 12 32 L 23 32 L 27 21 L 32 43 L 37 25 L 41 35 L 44 32 L 52 32"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Heart pulse dot -->
  <circle cx="32" cy="43" r="2.2" fill="#34d399" />
</svg>
